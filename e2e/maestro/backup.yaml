# seed: pioneer
# assert: Date.now() - new Date(__WW_DEV__.stores.preferences.getState().lastBackupDate).getTime() < 10 * 60 * 1000
# assert: __WW_DEV__.state().route.name === 'Import and Export'
appId: com.leviwilkerson.jwtimedev
name: Create a backup from Settings, which opens the share sheet, then cancel it
---
- extendedWaitUntil:
    visible: Home
    timeout: 60000
- tapOn: Account and settings
- tapOn: Settings
- tapOn: Backup & Restore
- tapOn: Create Backup
# The system share sheet offers the backup file; cancel it without saving
# anywhere. The screen's own hint names the file too, so each platform waits
# for its sheet rather than for the file name.
# iOS shows the sheet out of process, so only its dimmed backdrop ("dismiss
# popup") reads; tap outside the sheet.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: dismiss popup
          timeout: 20000
      - tapOn: dismiss popup
# Android's chooser says how many files it shares; go back.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: Sharing 1 file
          timeout: 20000
      - back
- assertNotVisible: dismiss popup
- assertNotVisible: witness-work-backup.json
- assertVisible: Restore From Backup
