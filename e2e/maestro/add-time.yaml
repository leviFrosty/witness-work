# seed: pioneer
# On a small phone the finished Get started checklist pushes Add Time half
# behind the floating tab bar, where a tap on its center lands on a tab.
# setup: (() => { __WW_DEV__.stores.preferences.setState({ homeChecklistDismissed: true }); return true })()
# assert: Object.values(__WW_DEV__.stores.serviceReports.getState().serviceReports).flatMap((m) => Object.values(m).flat()).some((e) => !e.id.startsWith('verify-') && e.hours * 60 + e.minutes > 0 && e.note === 'Cart witnessing' && new Date(e.date).toDateString() === new Date().toDateString())
# assert: __WW_DEV__.state().route.name !== 'Add Time'
appId: com.leviwilkerson.jwtimedev
name: Log time from the Home service report card
---
- extendedWaitUntil:
    visible: Add Time
    timeout: 60000
- tapOn: Add Time
- assertVisible: Submit
# An empty Submit must stay on the form and outline Time, rather than saving.
- tapOn:
    id: time-entry-save
- assertVisible: Submit
# Note opens the full-screen note editor with the cursor already in it.
- tapOn:
    id: time-entry-note-row
# The editor is a web view, slow to load on a fresh Metro; typing before it
# loads goes nowhere.
- extendedWaitUntil:
    true: __WW_DEV__.noteEditorLoaded()
    timeout: 60000
- inputText: Cart witnessing
# Done closes the editor; the note stays on the form until it's saved.
- tapOn:
    id: note-editor-done
- tapOn:
    id: time-entry-duration-pill
# The hours and minutes wheels both show a "2"; either one logs time. Android's
# wheel can settle a row short of the tapped value; the assert reads the stored entry.
- tapOn:
    text: '2'
    index: 0
- tapOn:
    id: time-entry-picker-done
- tapOn:
    id: time-entry-save
- assertVisible: Add Time
