# seed: pioneer
# A seed doesn't release a pet made earlier on the device, so start from the offer.
# setup: (() => { __WW_DEV__.pet.release(); __WW_DEV__.pet.resetPrompt(); return true })()
# assert: __WW_DEV__.stores.pet.getState().pet?.species === 'cat'
# assert: __WW_DEV__.stores.pet.getState().pet?.name === 'Biscuit'
# assert: __WW_DEV__.state().route.name === 'PetRoom'
appId: com.leviwilkerson.jwtimedev
name: Adopt a pet from Home, open its room, and rename it from its settings
---
# The pet's sprites redraw ten times a second, so taps here wait out --settle's
# deadline; assert text instead of waiting for a still screen.
- extendedWaitUntil:
    visible: Add Time
    timeout: 60000
# Scroll to the offer's button, not its heading: the heading can show with
# the button still below the fold.
- scrollUntilVisible:
    element: Choose a pet
# The offer's animals open the picker with that one chosen. (With the picker
# open, the offer's own Kitten behind it would make the name ambiguous.)
- tapOn:
    text: Kitten
    traits: button
# Adopt without a name; the card then goes by the species.
- assertVisible: Adopt
- tapOn: Adopt
- assertVisible: Go out, fill its hearts
- tapOn: Next
- assertVisible: Earn coins
- tapOn: Next
- assertVisible: Make it yours
- tapOn: Done
# The card's header carries the pet's name (the species until it has one),
# and ", New" while an item it owns is new (the seed's badges find secrets),
# and opens its room; the cog there opens its settings, where Name renames it.
- tapOn:
    text: [Kitten, 'Kitten, New']
- assertVisible: Shop
- tapOn: Settings
- assertVisible: Pet Settings
- tapOn: Name, Kitten
- assertVisible: Rename pet
- tapOn:
    text: Name (optional)
    editable: true
- inputText: Biscuit
- tapOn: Save
# Settings shows the new name; back in the room, so does its title.
- assertVisible: Biscuit
- tapOn: Back
- assertVisible: Biscuit
