# Notes Import metadata store (legacy App Attest compatibility state, runtime
# policy, and short-lived capabilities). Authoritative App Attest identity state
# lives in APP_ATTEST_IDENTITY. Usage lives in NOTES_IMPORT_INDEX. Holds NO notes
# text or model output (ADR 0008). Create with:
#   wrangler kv namespace create NOTES_KV
# then paste the printed id below.
#
# Runtime allowance policy (read with cacheTtl 60; KV > env vars above > code
# defaults per field). Fractions are valid for windowDays; allowance values are
# integer -1 (unlimited), 0 (none), or positive finite:
#   wrangler kv key put --binding NOTES_KV notes-import:limits '{"importsFree":3,"importsSupporter":-1,"refinementsFree":5,"refinementsSupporter":-1,"windowDays":30}'
# Add `--env beta` to edit Beta's separate namespace.
#
# Manual feature kill-switch (read by GET /notes-import/status). A JSON record
# mirroring the status response; flip the app's import entry points with no
# redeploy. Only `available:false` forces OFF — `available:true` (or an absent
# key) falls through to the provider check below:
#   wrangler kv key put --binding NOTES_KV notes-import:enabled '{"available":false,"reason":"down for maintenance"}'  # off
#   wrangler kv key put --binding NOTES_KV notes-import:enabled '{"available":true,"reason":""}'                       # on
# (add `--env beta` for the Beta worker). The endpoint also auto-disables when no
# allowlisted ZDR provider is healthy (OpenRouter metadata, no inference cost),
# cached under `notes-import:provider-health`.
#
# Minimum app version (read by GET /notes-import/status as `minAppVersion`,
# cacheTtl 60; KV > NOTES_IMPORT_MIN_APP_VERSION var > unset). Bump after a
# deploy that breaks the contract for older app builds; the app compares it to
# its own app.config.ts version, disables the Notes Import composer when below,
# and prompts the user to update. The worker does NOT reject requests itself.
#   wrangler kv key put --binding NOTES_KV notes-import:min-version '{"minVersion":"1.42.0"}'
#   wrangler kv key delete --binding NOTES_KV notes-import:min-version   # remove the floor
# (add `--env beta` for the Beta worker).
#
# Buddies kill switch (cacheTtl 60): enabled iff the value is "true"; an absent
# key falls back to BUDDIES_ENABLED. inbox/delete, slot/remove and slot/leave
# always work. The relay also caches its APNs provider token here
# (`buddies:apns-token`).
#   wrangler kv key put --binding NOTES_KV buddies:enabled true    # on
#   wrangler kv key put --binding NOTES_KV buddies:enabled false   # off
#   wrangler kv key delete --binding NOTES_KV buddies:enabled      # use the var
# (add `--env beta` for the Beta worker).
#
# Buddies photo blobs (cacheTtl 60; blob/put, blob/get, blob/delete, and
# `capabilities.photos` on inbox/sync): on iff the value is "on"; an absent key
# falls back to BUDDIES_PHOTOS (Beta and dev "on", prod unset = off). Needs Buddies on
# and the BUDDY_BLOBS bucket.
#   wrangler kv key put --binding NOTES_KV buddies:photos on      # on
#   wrangler kv key put --binding NOTES_KV buddies:photos off     # off
#   wrangler kv key delete --binding NOTES_KV buddies:photos      # use the var
# (add `--env beta` for the Beta worker).
#
# App-wide minimum version (GET /app/v1/config, cacheTtl 60; KV >
# APP_MIN_VERSION var > unset). Below it the app shows Update Required.
#   wrangler kv key put --binding NOTES_KV app:min-version '{"minVersion":"1.42.0"}'
#   wrangler kv key delete --binding NOTES_KV app:min-version   # remove the floor
#
# Legacy auth switch (cacheTtl 60): "off" refuses every request authenticated
# the way it was before sessions (account envelopes, account/register) with
# 426 upgrade_required; an absent key falls back to AUTH_LEGACY, then on. The
# runbook is AGENTS.md, "Turning off backward compatibility".
#   wrangler kv key put --binding NOTES_KV auth:legacy off
#   wrangler kv key delete --binding NOTES_KV auth:legacy        # use the var
# (add `--env beta` for the Beta worker).
#
# Cloud Sync switches (cacheTtl 60; witness-work ADR 0030). `sync:enabled`:
# "true" (or "on") on, anything else off; absent falls back to SYNC_ENABLED.
# `sync:entitlement`: "supporter" makes it a Supporter benefit again,
# "everyone" (or anything else) free; absent falls back to SYNC_ENTITLEMENT,
# else everyone (ADR 0040). Off refuses sync/put, list, get, live, and setting
# sync/request with 503 disabled; delete, clearing the request, and GET /sync
# work.
#   wrangler kv key put --binding NOTES_KV sync:enabled true          # on
#   wrangler kv key put --binding NOTES_KV sync:enabled false         # off
#   wrangler kv key put --binding NOTES_KV sync:entitlement everyone  # free
#   wrangler kv key put --binding NOTES_KV sync:entitlement supporter # Supporters
#   wrangler kv key delete --binding NOTES_KV sync:enabled            # use the var
#   wrangler kv key put --binding NOTES_KV sync:photos off            # photo puts off
#   wrangler kv key delete --binding NOTES_KV sync:photos             # use SYNC_PHOTOS
# `sync:changes`: "true" (or "on") lets devices send record changes
# (witness-work ADR 0060); anything else refuses sync/changes/* and the live
# socket's catch-up with 503 changes_disabled, and devices publish whole
# snapshots. Absent falls back to SYNC_CHANGES, else off.
#   wrangler kv key put --binding NOTES_KV sync:changes true          # on
#   wrangler kv key put --binding NOTES_KV sync:changes false         # off
#   wrangler kv key delete --binding NOTES_KV sync:changes            # use the var
# (add `--env beta` for the Beta worker).
#
# Shared Spaces switches (cacheTtl 60; witness-work ADR 0037, Shared Cars).
# `spaces:enabled`: "true" on, anything else off; absent falls back to
# SPACES_ENABLED. Off refuses every op and new live sockets with 503 disabled,
# except leave, member/remove, and delete. `spaces:maxMembers`: members plus
# open invites a space may hold (1-100; absent or invalid: 10).
#   wrangler kv key put --binding NOTES_KV spaces:enabled true       # on
#   wrangler kv key put --binding NOTES_KV spaces:enabled false      # off
#   wrangler kv key put --binding NOTES_KV spaces:maxMembers 12      # raise the cap
#   wrangler kv key delete --binding NOTES_KV spaces:enabled         # use the var
# `spaces:guests` (Territories' guest links, ADR 0047): "true" turns the
# public guest/sync and guest/put on, anything else off (503 disabled);
# absent falls back to SPACES_GUESTS. They also need spaces:enabled.
#   wrangler kv key put --binding NOTES_KV spaces:guests true        # on
#   wrangler kv key put --binding NOTES_KV spaces:guests false       # pause guest links
#   wrangler kv key delete --binding NOTES_KV spaces:guests          # use the var
# (add `--env beta` for the Beta worker).
#
# Web sign-up kill switch (cacheTtl 60): "off" refuses web/signup/options and
# web/signup with 503 disabled (web/recovery isn't affected); "on" opens them;
# absent falls back to WEB_SIGNUP. A failed read counts as on, since Turnstile
# and the caps still apply.
#   wrangler kv key put --binding NOTES_KV accounts:web-signup off   # pause
#   wrangler kv key delete --binding NOTES_KV accounts:web-signup    # use the var
# (add `--env beta` for the Beta worker).
#
# Route planning kill switch (cacheTtl 60): off iff the value is "false"; an
# absent key (or a failed read) leaves it on. Per-account limits always apply.
#   wrangler kv key put --binding NOTES_KV route-planning:enabled false   # off
#   wrangler kv key delete --binding NOTES_KV route-planning:enabled      # on
# (add `--env beta` for the Beta worker).
#
# Scribe AI switches (cacheTtl 60; AGENTS.md → Scribe AI has the runbook):
#   scribe:enabled               off: false/off/0/no/disabled or {"available":false}
#   scribe:disabled-tools        JSON array or comma list of tool names never offered
#   scribe:protocol-min          integer floor; below it /step is 426
#   scribe:min-version           {"minVersion":"x.y.z"}; advisory (status)
#   scribe:limits                JSON, any subset of the limits document
#   scribe:model                 JSON {model, providers, reasoningEffort, maxOutputTokens, strictTools, fallback}
#   scribe:provider-health       written by the provider probe
#   scribe:legacy-notes-import   "on" re-allows /notes-import/*; absent = 426
#                                (except GET /notes-import/status). Must be "on"
#                                before a deploy reaches apps without Scribe AI.
#   wrangler kv key put --binding NOTES_KV scribe:legacy-notes-import on
# (add `--env beta` for the Beta worker).
#
# Also holds the paywall's App Store ratings (`app-store-ratings:state` sweep
# progress + `app-store-ratings:summary`), refreshed by the cron below. See
# src/appStoreRatings/ratings.ts.
[[kv_namespaces]]
binding = "NOTES_KV"
id = "92871586e6dc4558a6ad3552ed7ee28c"

# App Store ratings sweep: BATCH_SIZE storefronts per run, resting once a
# full sweep completes until it is a week old. Repeated under [env.beta] and [env.dev.triggers].
[triggers]
crons = ["17 * * * *"]

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60

# Buddies per-caller limits (client IP, IPv6 by /64), one per op tier. Sizes
# and rationale: BUDDIES_ABUSE_LIMITS.edge in src/buddies/limits.ts, which
# limits.test.ts keeps equal to these (and to [env.dev]'s above).
# Unsigned ops (invite/fetch, invite/claim).
[[ratelimits]]
name = "BUDDIES_RATE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 120
  period = 60

# inbox/register.
[[ratelimits]]
name = "BUDDIES_REGISTER_LIMITER"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 60
  period = 60

# inbox/sync and the inbox/live upgrade.
[[ratelimits]]
name = "BUDDIES_READ_LIMITER"
namespace_id = "1004"

  [ratelimits.simple]
  limit = 600
  period = 60

# Every other signed op.
[[ratelimits]]
name = "BUDDIES_WRITE_LIMITER"
namespace_id = "1005"

  [ratelimits.simple]
  limit = 600
  period = 60

# blob/put (photo uploads).
[[ratelimits]]
name = "BUDDIES_BLOB_PUT_LIMITER"
namespace_id = "1006"

  [ratelimits.simple]
  limit = 60
  period = 60

# blob/get (photo downloads).
[[ratelimits]]
name = "BUDDIES_BLOB_GET_LIMITER"
namespace_id = "1007"

  [ratelimits.simple]
  limit = 600
  period = 60

# Shared Spaces' public guest ops (guest/sync, guest/put; witness-work ADR
# 0047): 120 a minute per network (IPv4, or IPv6 /64), keyed by an HMAC of
# the IP under ACCOUNT_TICKET_SECRET, never the IP. Repeated under [env.beta] and [env.dev].
[[ratelimits]]
name = "SPACES_GUEST_LIMITER"
namespace_id = "1008"

  [ratelimits.simple]
  limit = 120
  period = 60

# Anonymous accounts (witness-work ADR 0024). Without this binding, accounts
# are off: `account/register` answers `disabled` and `inbox/register` ignores
# account proofs. Apply migrations before deploying code that needs them:
# `wrangler d1 migrations apply ww-accounts --remote`. Repeated under [env.beta] and [env.dev].
[[d1_databases]]
binding = "ACCOUNTS_DB"
database_name = "ww-accounts"
database_id = "f11965ab-53e7-4748-bc27-48d9b77c3d8d"
migrations_dir = "migrations/accounts"

# Buddies note photos: sealed blobs at v1/<inboxId>/<blobId>, written and
# deleted by the sender's BuddyInbox DO (bookkeeping, expiry, sweeps, wipes).
# Every deploy runs scripts/r2-lifecycle.mjs first: it creates the bucket if
# it's missing and sets the lifecycle backstop (v1/ objects deleted 91 days
# after their last write; blobs live at most 90). Repeated (with its own
# bucket) under [env.dev] above.
[[r2_buckets]]
binding = "BUDDY_BLOBS"
bucket_name = "ww-buddy-blobs"

# Account backups (witness-work ADR 0026): one end-to-end encrypted object per
# device slot at v1/<accountId>/<slotId>. Without the binding, backup/* answers
# `disabled`. Every deploy runs scripts/r2-lifecycle.mjs first: it creates the
# bucket if it's missing and deletes v1/ objects 400 days after their last
# upload. Repeated (with their own buckets) under [env.beta] and [env.dev] above.
[[r2_buckets]]
binding = "ACCOUNT_BACKUPS"
bucket_name = "ww-account-backups"

# Cloud Sync (witness-work ADR 0030): one end-to-end encrypted snapshot per
# device slot at v1/<accountId>/<slotId>; the AccountSync DO holds the
# metadata. Without the binding, sync/* answers `disabled`. Every deploy runs
# scripts/r2-lifecycle.mjs first: it creates the bucket if it's missing and
# deletes v1/ objects 400 days after their last put (the DO's retention
# deletes sooner). Repeated (with their own buckets) under [env.beta] and [env.dev] above.
[[r2_buckets]]
binding = "ACCOUNT_SYNC"
bucket_name = "ww-account-sync"

# Cloud Sync photos (witness-work ADR 0040 §6): one end-to-end encrypted blob
# per put at v1/<accountId>/<name>/<putId>, written once; the AccountSync DO
# holds the rows and purges deleted photos 30 days later. No age rule: it
# would delete live photos, which are never rewritten. Every deploy runs
# scripts/r2-lifecycle.mjs first, which creates the bucket and keeps only the
# multipart-abort rule. Without the binding, photo routes answer
# `photos_disabled`. Repeated (with their own buckets) under [env.beta] and [env.dev] above.
[[r2_buckets]]
binding = "ACCOUNT_PHOTOS"
bucket_name = "ww-account-photos"

# Notes Import streaming — per-import run DO + per-user cap/index DO, each
# SQLite-backed (event log / active-import set). See
# docs/notes-import-streaming-durable-objects.md. Repeated under [env.beta] and [env.dev] above.
[[durable_objects.bindings]]
name = "NOTES_IMPORT_RUN"
class_name = "NotesImportRun"

[[durable_objects.bindings]]
name = "NOTES_IMPORT_INDEX"
class_name = "NotesImportIndex"

[[durable_objects.bindings]]
name = "APP_ATTEST_IDENTITY"
class_name = "AppAttestIdentity"

# Android Play Integrity challenges, one SQLite DO per install uuid. Repeated
# under [env.dev] above.
[[durable_objects.bindings]]
name = "PLAY_INTEGRITY_CHALLENGES"
class_name = "PlayIntegrityChallenges"

# Buddies relay — one inbox DO per inboxId, one invite DO per inviteId, both
# SQLite-backed. See docs/buddies-protocol.md. Repeated under [env.beta] and [env.dev] above.
[[durable_objects.bindings]]
name = "BUDDY_INBOX"
class_name = "BuddyInbox"

[[durable_objects.bindings]]
name = "BUDDY_INVITE"
class_name = "BuddyInvite"

# Route planning — one quota DO per account id (timestamps of its last 24 hours
# of optimizations only). Repeated under [env.beta] and [env.dev] above.
[[durable_objects.bindings]]
name = "ROUTE_PLANNING_QUOTA"
class_name = "RoutePlanningQuota"

# Buddies: signed inbox/register calls per caller (hashed client IP, IPv6 by
# /64) per hour over the last day, nothing else; deletes itself a day after
# the newest. Accounts reuse it under their own hashed names (account/register
# per caller, handoff/open per account). Repeated under [env.beta] and [env.dev] above.
[[durable_objects.bindings]]
name = "BUDDY_REGISTRATION_QUOTA"
class_name = "BuddyRegistrationQuota"

# Accounts: Set Up Another Device, one handoff channel per DO (a temporary
# public key and two sealed blobs, deleted within ten minutes of opening).
# Repeated under [env.beta] and [env.dev] above.
[[durable_objects.bindings]]
name = "ACCOUNT_HANDOFF"
class_name = "AccountHandoff"

# Cloud Sync: one index per account (slot metadata, change seq, put limits,
# retention alarm, live sockets; never data). Repeated under [env.beta] and [env.dev] above.
[[durable_objects.bindings]]
name = "ACCOUNT_SYNC_INDEX"
class_name = "AccountSync"

# Shared Spaces (Shared Cars): one per space (sealed records, members by token
# hash, wraps, invites, change seq, put limits, retention alarm, live sockets;
# never an account). Repeated under [env.beta] and [env.dev] above.
[[durable_objects.bindings]]
name = "SHARED_SPACE"
class_name = "SharedSpace"

# Scribe AI: one meter per account (usage windows, step keys, open turns,
# active steps, charges for 31 days, paper pages for 24 hours; never content).
# Repeated under [env.beta] and [env.dev] above.
[[durable_objects.bindings]]
name = "SCRIBE_METER"
class_name = "ScribeMeter"

# Accounts: rolling-window counters, one per hashed name (failed passkey
# sign-ins per hashed caller IP; counts only, deleted once out of their
# window). Repeated under [env.beta] and [env.dev] above.
[[durable_objects.bindings]]
name = "ACCOUNT_RATE_COUNTER"
class_name = "AccountRateCounter"

# Approving a browser from a phone (docs/passkeys-protocol.md): one channel
# per QR code, 75 seconds unclaimed, 5 minutes claimed.
[[durable_objects.bindings]]
name = "ACCOUNT_APPROVAL"
class_name = "AccountApproval"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NotesImportRun", "NotesImportIndex"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AppAttestIdentity"]
# AppAttestIdentity becomes authoritative at this cutover. Never roll production
# back to a pre-v2/KV-authoritative Worker; ship a forward fix instead.

[[migrations]]
tag = "v3"
new_sqlite_classes = ["BuddyInbox", "BuddyInvite"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["PlayIntegrityChallenges"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["RoutePlanningQuota"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["BuddyRegistrationQuota"]

[[migrations]]
tag = "v7"
new_sqlite_classes = ["AccountHandoff"]

[[migrations]]
tag = "v8"
new_sqlite_classes = ["AccountSync"]

[[migrations]]
tag = "v9"
new_sqlite_classes = ["ScribeMeter"]

# Production's history (ww-proxy was at v9 before these). SharedSpace (v10)
# landed on main first and the web launch's AccountRateCounter (v11) and
# AccountApproval (v12) follow it. If main ships first, production goes v9 to
# v10, then v10 to v12 when the web launch ships; if the web launch ships
# first, v9 to v12 in one deploy. [env.dev.migrations] replaces this list for
# dev, which applied them in another order (above).
[[migrations]]
tag = "v10"
new_sqlite_classes = ["SharedSpace"]

[[migrations]]
tag = "v11"
new_sqlite_classes = ["AccountRateCounter"]

[[migrations]]
tag = "v12"
new_sqlite_classes = ["AccountApproval"]

[observability]
enabled = true
head_sampling_rate = 1 # optional. default = 1.
logs.persist = true

# Secrets should be set via:
# wrangler secret put HERE_API_KEY
# wrangler secret put SENTRY_DSN
# wrangler secret put OPENROUTER_API_KEY        # OpenRouter key (routed ZDR-only)
# wrangler secret put REVENUECAT_API_KEY        # RevenueCat REST v1 secret (sk_...)
# wrangler secret put REVENUECAT_WEBHOOK_AUTHORIZATION [--env beta]  # RevenueCat webhook secret (ADR 0029), per worker
# NOTES_IMPORT_DEV_BYPASS_TOKEN is local only (.dev.vars), never a Worker secret
# wrangler secret put ADMIN_API_TOKEN                # dedicated prod reset token
# wrangler secret put ADMIN_API_TOKEN --env beta     # DIFFERENT Beta admin token
# Generate each admin token with: openssl rand -base64 32
# Buddies pushes (APNs token auth); without both, the relay skips pushes:
# wrangler secret put APNS_KEY_ID [--env beta]          # 10-char key id of the .p8
# wrangler secret put APNS_PRIVATE_KEY [--env beta]     # .p8 PEM contents: < AuthKey_XXXX.p8
# Buddies Android pushes (FCM HTTP v1); without it, the relay skips them:
# jq -c . buddies-fcm-sender.json | wrangler secret put FCM_SERVICE_ACCOUNT_JSON [--env beta]
# Android Notes Import (ADR 0017): the Play Integrity service-account JSON key:
# wrangler secret put PLAY_INTEGRITY_SERVICE_ACCOUNT_JSON [--env beta] < play-integrity-key.json
# Account session access tokens (ADR 0027); without it, /accounts/v1/sessions* is disabled.
# A different value per worker, at least 32 characters (openssl rand -base64 32):
# wrangler secret put ACCOUNT_TOKEN_SECRET [--env beta]
# Rotation: the old value goes to ACCOUNT_TOKEN_SECRET_PREVIOUS first (verify only;
# refresh tokens issued under it refresh only while it's set, see AGENTS.md).
# wrangler secret put ACCOUNT_TOKEN_SECRET_PREVIOUS [--env beta]
# Browser live socket tickets (POST /accounts/v1/live/ticket); without it, browser
# live sockets are disabled. Its own value per worker, never ACCOUNT_TOKEN_SECRET's:
# openssl rand -base64 32 | wrangler secret put LIVE_TICKET_SECRET [--env beta]
# MapKit JS tokens (witness-work ADR 0037 §8; APPLE_TEAM_ID is the issuer); without
# both, POST /maps/v1/mapkit-tokens answers 503 maps_unconfigured:
# wrangler secret put MAPKIT_JS_KEY_ID [--env beta]        # 10-char MapKit JS key id
# wrangler secret put MAPKIT_JS_PRIVATE_KEY [--env beta]   # .p8 PEM contents: < AuthKey_XXXX.p8
# Passkeys (ADR 0038): the challenge and ticket MAC keys, each its own value per
# worker, at least 32 characters, never ACCOUNT_TOKEN_SECRET's. Without them the
# passkey routes and ticket sessions answer `disabled`:
# openssl rand -base64 32 | wrangler secret put PASSKEY_CHALLENGE_SECRET [--env beta]
# openssl rand -base64 32 | wrangler secret put ACCOUNT_TICKET_SECRET [--env beta]
# Web sign-up and recovery (ADR 0038 §5): the Turnstile widget's secret key,
# from the dashboard (Turnstile → the widget → Settings). Production needs it
# (and TURNSTILE_SITE_KEY) before web sign-up opens; dev uses Cloudflare's
# always-passing test secret until its own widget's is set:
# wrangler secret put TURNSTILE_SECRET_KEY [--env beta]
