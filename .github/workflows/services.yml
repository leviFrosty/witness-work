name: Website deploy

# Deploys the website, Help Center and Help Center search Worker from services/.
# Two deployed environments; development is local only and deploys nothing.
#   push to main touching the paths below -> Beta:       beta.witnesswork.app (services-beta)
#                                            AND
#                                            Production: witnesswork.app (services-production)
#   workflow_dispatch on main             -> Beta only (a manual redeploy)
#   workflow_dispatch on any other ref    -> nothing (both jobs are skipped)
# Beta is always the tip of main. Production only ever comes from a push to
# main. Never deploys the app or ww-api.
# Pull requests are checked by the Checks workflow (tests.yml), not here.
# The Cloudflare token reaches only the deploy steps (services/README.md).
on:
  push:
    branches:
      - main
    paths:
      - services/**
      # The API has its own workflow (api-deploy.yml).
      - '!services/api/**'
      - .github/workflows/services.yml
      - .github/scripts/services-smoke.sh
      - .nvmrc
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: services

jobs:
  deploy-beta:
    name: 'Beta: beta.witnesswork.app'
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: services-beta
    concurrency:
      group: services-beta
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: services/package.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: services/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm --filter marketing run build:beta && pnpm --filter help-search exec wrangler deploy --env beta --dry-run --outdir dist

      - name: Deploy website
        run: pnpm exec wrangler deploy --env beta
        working-directory: services/marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy help search
        run: pnpm exec wrangler deploy --env beta
        working-directory: services/help-search
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test
        env:
          SITE: https://beta.witnesswork.app
          SEARCH: https://help-search-beta.witnesswork.app
          EXPECT_NOINDEX: 'true'
          # A brand-new Beta search Worker has no index until its first sync.
          ALLOW_EMPTY_INDEX: 'true'
        run: bash ../.github/scripts/services-smoke.sh

  deploy-production:
    name: 'Production: witnesswork.app'
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: services-production
    concurrency:
      group: services-production
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: services/package.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: services/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Deploy website
        run: pnpm exec wrangler deploy
        working-directory: services/marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy help search
        run: pnpm exec wrangler deploy
        working-directory: services/help-search
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test
        env:
          SITE: https://witnesswork.app
          SEARCH: https://help-search.witnesswork.app
          EXPECT_NOINDEX: 'false'
          LEGACY_SEARCH: https://help-search.leviwilkerson.com
        run: bash ../.github/scripts/services-smoke.sh
