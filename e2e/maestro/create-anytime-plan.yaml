# seed: pioneer
# assert: __WW_DEV__.stores.serviceReports.getState().dayPlans.some((p) => p.anytime === true && p.minutes === 120 && p.startTimeInMinutes === 720)
# assert: __WW_DEV__.stores.serviceReports.getState().dayPlans.some((p) => !p.anytime && p.minutes === 120)
# assert: __WW_DEV__.stores.preferences.getState().planTimeMode === 'span'
appId: com.leviwilkerson.jwtimedev
name: Plan hours with no set time, then a start time, and the form remembers the last one
---
- extendedWaitUntil:
    visible: Quick Action
    timeout: 60000
- tapOn: Quick Action
- tapOn: Create Plan
- assertVisible: Add One Time Plan
# New Plans start with no set time (Anytime); a preset sets the hours.
- assertVisible: Anytime
- tapOn:
    id: plan-preset-120
- tapOn:
    id: plan-save
- assertNotVisible: Add One Time Plan
- extendedWaitUntil:
    visible: Quick Action
    timeout: 20000
# The next Plan opens as long as the last one; Start time opens the Start and
# End wheels and keeps that length.
- tapOn: Quick Action
- tapOn: Create Plan
- tapOn:
    id: plan-start-row
- waitForAnimationToEnd
- tapOn:
    id: plan-start-done
- assertNotVisible: Anytime
- tapOn:
    id: plan-save
- assertNotVisible: Add One Time Plan
