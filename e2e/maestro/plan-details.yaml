# seed: pioneer
# assert: __WW_DEV__.state().route.name === 'Schedule'
appId: com.leviwilkerson.jwtimedev
name: Open a Plan's details from Schedule, then edit it
---
- extendedWaitUntil:
    visible: Schedule
    timeout: 60000
- tapOn: Schedule
# Schedule is a calendar, and a Plan's row is in its day's sheet. The seed's
# first Plan is "Cart witnessing" tomorrow, so it's the first planned day.
# Let the calendar finish its jump to today first.
- waitForAnimationToEnd
# Android's tree can lag the calendar under load, so wait for the day's label.
- extendedWaitUntil:
    visible: Planned 2 hours
    timeout: 15000
- tapOn:
    text: Planned 2 hours
    index: 0
- assertVisible: Cart witnessing
# Tapping a Plan opens its details in the day's sheet, not the form, and Edit
# opens the form there too: the route stays on Schedule.
- tapOn:
    id: plan-row-verify-plan-0
- assertVisible: Duration
- assertVisible: Standard
- tapOn: Edit
- assertVisible: Edit Plan
