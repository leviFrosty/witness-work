# seed: pioneer
# assert: __WW_DEV__.stores.serviceReports.getState().dayPlans.find((p) => p.id === 'verify-plan-0')?.title === 'Cart witnessing at the park'
appId: com.leviwilkerson.jwtimedev
name: Edit a Plan's title and save it from the dock
---
- extendedWaitUntil:
    visible: Schedule
    timeout: 60000
- tapOn: Schedule
# Schedule is a calendar, and a Plan's row is in its day's sheet. The seed's
# first Plan is "Cart witnessing" tomorrow, so it's the first planned day.
# Let the calendar finish its jump to today first.
- waitForAnimationToEnd
- tapOn:
    text: Planned 2 Hrs
    index: 0
- assertVisible: Cart witnessing
- tapOn:
    id: plan-row-verify-plan-0
- tapOn: Edit
- assertVisible: Edit Plan
- tapOn:
    id: plan-title-input
- inputText: ' at the park'
- hideKeyboard
- tapOn:
    id: plan-save
- assertNotVisible: Edit Plan
