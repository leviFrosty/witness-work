# seed: pioneer
# A seed leaves mileage tracking unanswered, so Home asks "Track mileage?".
# The finished Get started checklist would push that card down, and the pet
# offer's sprites redraw ten times a second, which slows every screen read.
# The routine offer sits above the card too.
# setup: (() => { __WW_DEV__.stores.preferences.setState({ homeChecklistDismissed: true, petPromptDismissed: true, routineEnabled: false }); return true })()
# assert: __WW_DEV__.stores.preferences.getState().mileageTrackingEnabled === true
# assert: __WW_DEV__.stores.mileage.getState().vehicles.some((v) => v.name === 'Family sedan')
# assert: (() => { const { vehicles, vehicleSetups } = __WW_DEV__.stores.mileage.getState(); const car = vehicles.find((v) => v.name === 'Family sedan'); return vehicleSetups.some((s) => s.vehicleId === car?.id && s.fuelId === 'premade-fuel-gasoline') })()
# assert: (() => { const { vehicles, trips } = __WW_DEV__.stores.mileage.getState(); const car = vehicles.find((v) => v.name === 'Family sedan'); const d = new Date(); const today = [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-'); return trips.length === 1 && trips.some((t) => t.vehicleId === car?.id && t.date === today && Math.abs(t.distanceMiles - 12.5) < 0.01) })()
appId: com.leviwilkerson.jwtimedev
name: Turn on mileage from Home, add a car, log a trip, and see it in this month
---
- extendedWaitUntil:
    visible: Track mileage?
    timeout: 60000
# The card sits below the week strip, under the tab bar on an iPhone.
- scrollUntilVisible:
    element: 'Yes'
- tapOn: 'Yes'
# "Yes" opens Add Car, with the premade Gasoline already chosen as its fuel.
# A row's label names its field too, so pick the field.
- assertVisible: Fuel Economy (mpg)
- assertVisible: Gasoline · $3.86/gal
- tapOn:
    text: Name
    editable: true
- inputText: Family sedan
- hideKeyboard
- tapOn:
    text: Save
    traits: button
# Home's Mileage card now offers Log Trip; with one car, the trip takes it.
- scrollUntilVisible:
    element: Log Trip
- tapOn:
    text: Log Trip
    traits: button
- assertVisible: Round Trip
- tapOn:
    text: Distance (mi)
    editable: true
- inputText: '12.5'
- hideKeyboard
# Home's timer card under the sheet has a Save button too.
- tapOn:
    id: trip-save
# The card counts this month's trips and distance.
- assertVisible: 1 trip
- assertVisible: 12.5 mi
