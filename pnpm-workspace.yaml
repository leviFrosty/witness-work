packages:
  - '.'
nodeLinker: hoisted
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - typescript
  - '@typescript/*'
allowBuilds:
  '@sentry/cli': true
  '@shopify/react-native-skia': true
  esbuild: true
  protobufjs: false
  unrs-resolver: true
onlyBuiltDependencies:
  - '@sentry/cli'
  - esbuild
  - protobufjs
  - '@shopify/react-native-skia'
overrides:
  react-native-safe-area-context: $react-native-safe-area-context
  axios: '>=1.15.2'
  '@expo/metro': 56.0.2
  '@grpc/grpc-js': 1.14.4
  glob: '>=11.1.0'
  '@xmldom/xmldom': 0.8.15
  '@tootallnate/once': '>=3.0.1'
  postcss: '^8.5.26'
  fast-xml-parser: '>=5.7.0'
  protobufjs: 7.6.6
  follow-redirects: '>=1.16.0'
  'brace-expansion@1': '^1.1.18'
  'brace-expansion@5': '^5.0.9'
  browserslist: 4.28.9
  fast-uri: 3.1.7
  'js-yaml@3': 3.15.2
  'js-yaml@4': 4.3.2
  metro: 0.84.5
  metro-config: 0.84.5
  metro-core: 0.84.5
  metro-runtime: 0.84.5
  metro-source-map: 0.84.5
  'nanoid@3': '^3.3.18'
  shell-quote: '^1.10.0'
  'ws@8': '^8.21.3'
patchedDependencies:
  expo-alternate-app-icons: patches/expo-alternate-app-icons.patch
enableGlobalVirtualStore: true
