name: Tests

on:
  push:
    branches:
      - main
  # Run on demand against any branch, e.g. an integration branch before it
  # lands on main: `gh workflow run tests.yml --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run lint
        run: pnpm run lint

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run testFinal

      - name: Check OTA and local environment tools
        run: pnpm run test:ota && pnpm run test:local-env

      - name: Check for circular dependencies
        run: pnpm run deps
