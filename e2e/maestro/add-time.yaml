# seed: pioneer
# assert: Object.values(__WW_DEV__.stores.serviceReports.getState().serviceReports).flatMap((m) => Object.values(m).flat()).some((e) => !e.id.startsWith('verify-') && e.hours > 0 && new Date(e.date).toDateString() === new Date().toDateString())
appId: com.leviwilkerson.jwtimedev
name: Log time from the Home service report card
---
- extendedWaitUntil:
    visible: Add Time
    timeout: 60000
- tapOn: Add Time
- assertVisible: Entering time information below will log service time for that day
# Android appends the current value to the wheel button's name.
- tapOn:
    text: [Hours, 'Hours, 0']
    traits: button
# Android's wheel can settle a row short of the tapped value; the assert reads the stored entry.
- tapOn: '2'
- tapOn: Done
- tapOn: Submit
- assertNotVisible: Entering time information below will log service time for that day
- assertVisible: Add Time
