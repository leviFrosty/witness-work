packages:
  - '.'
nodeLinker: hoisted
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - typescript
  - '@typescript/*'
allowBuilds:
  '@shopify/react-native-skia': true
  esbuild: true
  unrs-resolver: true
onlyBuiltDependencies:
  - esbuild
  - '@shopify/react-native-skia'
overrides:
  # apple-targets 5.0.0 pins SDK 55's prebuild-config, which would displace
  # SDK 57's hoisted copy. It only uses `writeContentsJsonAsync` from it.
  '@bacons/apple-targets>@expo/prebuild-config': 57.0.16
  expo-modules-autolinking: 57.0.6
  react-native-safe-area-context: $react-native-safe-area-context
  axios: 1.20.0
  '@expo/metro': 56.0.2
  glob: '>=11.1.0'
  # Fix both critical Handlebars injection advisories in eslint-plugin-boundaries.
  handlebars: 4.7.10
  '@xmldom/xmldom': 0.8.15
  '@tootallnate/once': '>=3.0.1'
  postcss: '^8.5.26'
  fast-xml-parser: '>=5.7.0'
  follow-redirects: 1.16.1
  'brace-expansion@1': 1.1.21
  'brace-expansion@5': 5.0.12
  browserslist: 4.28.9
  fast-uri: 3.1.8
  'js-yaml@3': 3.15.2
  'js-yaml@4': 4.3.2
  metro: 0.84.5
  metro-config: 0.84.5
  metro-core: 0.84.5
  metro-runtime: 0.84.5
  metro-source-map: 0.84.5
  'nanoid@3': '^3.3.18'
  shell-quote: '^1.11.0'
  'ws@8': '^8.21.3'
  # Advisories in build and test tooling only: the Expo CLI dev server, Metro's
  # postcss, vitest's vite, and the hot-updater CLI and console.
  '@hot-updater/expo>@babel/core': 7.29.7
  compression: 1.8.2
  hono: 4.13.13
  source-map-js: 1.2.2
  vite: 7.3.7
patchedDependencies:
  '@expo/dom-webview@57.0.1': patches/@expo__dom-webview@57.0.1.patch
  '@expo/fingerprint@0.20.13': patches/@expo__fingerprint.patch
  '@expo/ui@57.0.21': patches/@expo__ui@57.0.21.patch
  expo-alternate-app-icons: patches/expo-alternate-app-icons.patch
  expo@57.0.26: patches/expo@57.0.26.patch
  hot-updater@1.0.2: patches/hot-updater@1.0.2.patch
  react-native-gesture-handler@2.32.0: patches/react-native-gesture-handler@2.32.0.patch
  react-native-maps@1.27.2: patches/react-native-maps@1.27.2.patch
enableGlobalVirtualStore: true
