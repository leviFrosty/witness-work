name: Production Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Validate & Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: Production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const semver = require('semver');
          const version = require('./package.json').version;
          const config = fs.readFileSync('app.config.ts', 'utf8');
          const versions = [...config.matchAll(/\bversion:\s*['"]([\d.]+)['"]/g)];
          if (!semver.valid(version) || process.env.GITHUB_REF_NAME !== `v${version}` ||
              versions.length !== 1 || versions[0][1] !== version) {
            throw new Error('Release tag, package.json and app.config.ts must match');
          }
          NODE

      - name: Check locale completeness
        run: pnpm run check:locales

      - name: Run lint
        run: pnpm run lint

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run testFinal

      - name: Check for circular dependencies
        run: pnpm run deps

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const version = tag.replace('v', '');
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner, repo: context.repo.repo, tag
              });
              console.log(`Release ${tag} already exists`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            // Get the previous release to compare commits
            let previousTag = null;
            try {
              const releases = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 1
              });
              if (releases.data.length > 0) {
                previousTag = releases.data[0].tag_name;
              }
            } catch (error) {
              console.log('No previous releases found');
            }

            // Get commits since last release
            let commits = [];
            if (previousTag) {
              const comparison = await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: previousTag,
                head: tag
              });
              commits = comparison.data.commits;
            } else {
              // If no previous release, get recent commits
              const commitsResponse = await github.rest.repos.listCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: tag,
                per_page: 20
              });
              commits = commitsResponse.data;
            }

            // Format commits into changelog
            const changelog = commits
              .map(commit => {
                const message = commit.commit.message.split('\n')[0];
                const sha = commit.sha.substring(0, 7);
                return `- ${message} (${sha})`;
              })
              .join('\n');

            const body = `### Changes${previousTag ? ` since ${previousTag}` : ''}
            ${changelog || 'No changes recorded'}`;

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Release ${version}`,
              body: body,
              draft: false,
              prerelease: false
            });
