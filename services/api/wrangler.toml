name = "ww-proxy"
main = "src/index.ts"
compatibility_date = "2024-11-27"
# `enable_request_signal`: `request.signal` aborts when the client leaves, so a
# Scribe AI step or page read stops its model call (protocol: Metering).
compatibility_flags = ["nodejs_compat", "enable_request_signal"]
workers_dev = false
preview_urls = false
# Generate source maps on deploy (and upload them to Cloudflare for mapped
# stacks in dashboard/tail). Sentry gets its own copy via the package.json
# `deploy` script: `--outdir dist` + `pnpm run sentry:sourcemaps`. Inheritable
# key — applies to [env.beta] and [env.dev] too.
upload_source_maps = true

# Static assets (og-image, apple-touch-icon) served directly by Cloudflare's
# edge cache. Requests to paths matching files under `./public` are served
# from the edge; unmatched paths fall through to the worker (default
# behavior when `main` is set and `not_found_handling` is omitted).
[assets]
directory = "./public"
binding = "ASSETS"

# The old host stays for good, never redirected: shipped builds call it, and
# links people already sent point at it (witness-work ADR 0042).
[[routes]]
pattern = "ww-proxy.leviwilkerson.com"
custom_domain = true

[[routes]]
pattern = "api.witnesswork.app"
custom_domain = true

# The website apex's link pages and association files (docs/link-pages.md).
# The site Worker is the apex's Custom Domain and serves everything else. Only
# full-word paths: the short /c, /c/*, /b and /h stay on the old host. A
# pattern without `*` matches only that URL with no query string, so the
# pages end in `*` (`?lang=`, `?fbclid=`); src/linkHosts.ts hands the site
# anything else they catch. Repeated for beta.witnesswork.app under [env.beta].
[[routes]]
pattern = "witnesswork.app/.well-known/apple-app-site-association"
zone_name = "witnesswork.app"

[[routes]]
pattern = "witnesswork.app/.well-known/assetlinks.json"
zone_name = "witnesswork.app"

[[routes]]
pattern = "witnesswork.app/accounts/handoff*"
zone_name = "witnesswork.app"

[[routes]]
pattern = "witnesswork.app/contacts*"
zone_name = "witnesswork.app"

[[routes]]
pattern = "witnesswork.app/buddies/invite*"
zone_name = "witnesswork.app"

# Exposes the deployed Worker version (id/tag/timestamp) to the runtime so
# /health can report the actual build. NOT inherited by named envs — repeated
# under [env.beta.version_metadata] and [env.dev.version_metadata] below.
[version_metadata]
binding = "CF_VERSION_METADATA"

# --- Beta worker ---------------------------------------------------------------
# A fully separate Worker (`ww-proxy-beta`) for WitnessWork Beta: the TestFlight
# Beta app (com.leviwilkerson.jwtimebeta) and the web beta
# (beta.app.witnesswork.app). It always runs the tip of `main`: the API deploy
# workflow deploys it on every push that touches services/api. Attestation is
# production grade (TestFlight builds use Apple's production App Attest
# environment) and there is no dev bypass. Its data is its own: nothing is
# shared with production.
# In Wrangler, `vars`, `kv_namespaces`, and `ratelimits` are NOT inherited by a
# named env, so they're repeated below.
[env.beta]
name = "ww-proxy-beta"
workers_dev = false
preview_urls = false

# Routes ARE inherited by named envs (unlike vars/kv/ratelimits), so Beta lists
# its own complete set; otherwise it would take prod's hosts on deploy. The
# apex routes are Beta's link pages on the Beta website (beta.witnesswork.app,
# the site's Beta Worker Custom Domain). Patterns as for prod above.
[[env.beta.routes]]
pattern = "api-beta.witnesswork.app"
custom_domain = true

[[env.beta.routes]]
pattern = "beta.witnesswork.app/.well-known/apple-app-site-association"
zone_name = "witnesswork.app"

[[env.beta.routes]]
pattern = "beta.witnesswork.app/.well-known/assetlinks.json"
zone_name = "witnesswork.app"

[[env.beta.routes]]
pattern = "beta.witnesswork.app/accounts/handoff*"
zone_name = "witnesswork.app"

[[env.beta.routes]]
pattern = "beta.witnesswork.app/contacts*"
zone_name = "witnesswork.app"

[[env.beta.routes]]
pattern = "beta.witnesswork.app/buddies/invite*"
zone_name = "witnesswork.app"

[env.beta.version_metadata]
binding = "CF_VERSION_METADATA"

[env.beta.triggers]
crons = ["17 * * * *"]

[env.beta.vars]
# "Continue on the web" on the contact and Buddies invite pages.
WEB_APP_ORIGIN = "https://beta.app.witnesswork.app"
# Named environments do not inherit the production model override.
NOTES_IMPORT_MODEL = "openai/gpt-6-luna"
NOTES_IMPORT_REASONING_EFFORT = "low"
NOTES_IMPORT_PROVIDERS = "azure"
NOTES_IMPORT_MAX_OUTPUT_TOKENS = "32000"
# TestFlight builds attest in Apple's production App Attest environment.
APP_ATTEST_ENVIRONMENT = "production"
# The WitnessWork Beta app (witness-work app.config.ts, beta variant).
IOS_BUNDLE_ID = "com.leviwilkerson.jwtimebeta"
# Deprecated and ignored: Supporter status follows witness-work ADR 0014.
REVENUECAT_ENTITLEMENT_ID = "Supporter"
# Runtime-limit env fallbacks. Named environments do not inherit [vars], so all
# five are explicitly repeated here. KV `notes-import:limits` overrides each
# field independently for this environment.
NOTES_IMPORT_FREE_CREDITS = "3"
NOTES_IMPORT_FREE_CREDITS_SUPPORTER = "-1"
NOTES_IMPORT_MAX_REFINEMENTS = "5"
NOTES_IMPORT_MAX_REFINEMENTS_SUPPORTER = "-1"
NOTES_IMPORT_WINDOW_DAYS = "30"
# Buddies kill-switch fallback when KV `buddies:enabled` is absent. On in Beta.
BUDDIES_ENABLED = "true"
# Buddies photo blobs fallback when KV `buddies:photos` is absent. On in Beta.
BUDDIES_PHOTOS = "on"
# Legacy-auth fallback when KV `auth:legacy` is absent (witness-work ADR 0027):
# "off" refuses pre-session auth with 426 upgrade_required. Off on Beta: every
# Beta build opens sessions. KV `auth:legacy` = "on" turns it back on here.
AUTH_LEGACY = "off"
# Passkeys (witness-work ADR 0038, docs/passkeys-protocol.md): the RP IDs this
# worker accepts (the first is the default, and the one Android origins pair
# with), and each RP ID's origins. Checked as pairs, never as two lists.
# Beta has its own RP ID, so a Beta passkey never shows up when signing in to
# production. No Android origins: Android has no Beta app (a beta-profile
# Android build is the production package and calls production).
PASSKEY_RP_IDS = "beta.app.witnesswork.app"
PASSKEY_ORIGINS = '''{"beta.app.witnesswork.app":["https://beta.app.witnesswork.app"]}'''
# Web sign-up (docs/passkeys-protocol.md, "Web sign-up"): the kill switch's
# fallback when KV `accounts:web-signup` is absent, and the caps. Turnstile has
# no Beta widget yet, so web sign-up and recovery answer `disabled` here, as in
# production: create a widget for verify-beta.witnesswork.app, set its site key
# below and its secret as TURNSTILE_SECRET_KEY, and they turn on.
WEB_SIGNUP = "on"
WEB_SIGNUP_PER_IP_DAY = "3"
WEB_SIGNUP_PER_ASN_HOUR = "30"
WEB_RECOVERY_PER_IP_DAY = "10"
# TURNSTILE_SITE_KEY = ""
TURNSTILE_HOSTNAMES = "verify-beta.witnesswork.app"
# App-wide minimum version fallback when KV `app:min-version` is absent
# (GET /app/v1/config). Unset = no floor.
# APP_MIN_VERSION = "1.42.0"
# Cloud Sync (witness-work ADR 0030) fallbacks when KV `sync:enabled` /
# `sync:entitlement` are absent. On in Beta; free for everyone (ADR 0040).
SYNC_ENABLED = "true"
SYNC_ENTITLEMENT = "everyone"
# Record changes (witness-work ADR 0060) fallback when KV `sync:changes` is
# absent. On in Beta. Only apps that send changes use it.
SYNC_CHANGES = "true"
# Shared Spaces (Shared Cars, witness-work ADR 0037) fallback when KV
# `spaces:enabled` is absent. On in Beta.
SPACES_ENABLED = "true"
# Territories' guest links (witness-work ADR 0047): the public guest ops'
# fallback when KV `spaces:guests` is absent. On in Beta.
SPACES_GUESTS = "true"
# The web app's origins (witness-work ADR 0038 §10): CORS and browser live
# sockets admit exactly these (comma-separated, no wildcards). Named
# environments don't inherit [vars], so it's set in each.
WEB_APP_ORIGINS = "https://beta.app.witnesswork.app"
# Cloud Sync photos' switch fallback when KV `sync:photos` is absent (on).
# SYNC_PHOTO_LIMIT_BYTES (unset: 2,000,000,000) overrides the per-account photo
# storage.
SYNC_PHOTOS = "on"
# Android (witness-work ADR 0017). Android has no Beta app, so nothing calls
# these here; they mirror production in case a Play test build is pointed at
# Beta by hand.
ANDROID_PACKAGE_NAME = "com.leviwilkerson.jwtime"
PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER = "53605912655"
ANDROID_CERT_SHA256_DIGESTS = "TBOYNDcshVpuphnPrwPUa5EUFC3ry8vL8cHHQFU-HKw"
# Scribe AI (witness-work docs/scribe-ai-protocol.md) fallbacks when KV
# `scribe:model` / `scribe:limits` have no value for a field. Named
# environments don't inherit [vars], so they're repeated here; they mirror the
# code defaults (src/scribe/config.ts).
SCRIBE_MODEL = "openai/gpt-6-luna"
SCRIBE_PROVIDERS = "azure"
SCRIBE_REASONING_EFFORT = "medium"
SCRIBE_MAX_OUTPUT_TOKENS = "4096"
SCRIBE_FREE_MONTHLY = "150000"
SCRIBE_SUPPORTER_SESSION = "540000"
SCRIBE_SUPPORTER_WEEKLY = "1550000"
# The MapKit JS frame's origin that POST /maps/v1/mapkit-tokens names in its
# tokens (witness-work ADR 0037 §8). Comma-separated; the first is the default.
MAPKIT_JS_ORIGINS = "https://maps-beta.witnesswork.app"
# The Overpass API interpreter POST /maps/v1/addresses asks for OpenStreetMap
# house numbers (src/maps/territoryAddresses.ts). Public; the default if unset.
OVERPASS_URL = "https://overpass-api.de/api/interpreter"
# Anonymous usage events (src/analytics.ts). Off on Beta so test use stays out
# of the production dashboards (events would carry `environment: production`).
# POSTHOG_PROJECT_TOKEN = "phc_rTisLfzXzn6yTmrKVKU8dnHNeyd7HNi4Sq6HDhAayt25"

# Separate KV so Beta never shares prod runtime policy or App Attest v1 mirrors.
[[env.beta.kv_namespaces]]
binding = "NOTES_KV"
id = "ec4bcbb940de46748011bcdbb6a48e1c"

# Notes Import streaming DOs (separate Beta namespaces; bindings + migrations are
# NOT inherited from prod, so they are repeated here — keep in sync).
[[env.beta.durable_objects.bindings]]
name = "NOTES_IMPORT_RUN"
class_name = "NotesImportRun"

[[env.beta.durable_objects.bindings]]
name = "NOTES_IMPORT_INDEX"
class_name = "NotesImportIndex"

[[env.beta.durable_objects.bindings]]
name = "APP_ATTEST_IDENTITY"
class_name = "AppAttestIdentity"

[[env.beta.durable_objects.bindings]]
name = "PLAY_INTEGRITY_CHALLENGES"
class_name = "PlayIntegrityChallenges"

[[env.beta.durable_objects.bindings]]
name = "BUDDY_INBOX"
class_name = "BuddyInbox"

[[env.beta.durable_objects.bindings]]
name = "BUDDY_INVITE"
class_name = "BuddyInvite"

[[env.beta.durable_objects.bindings]]
name = "ROUTE_PLANNING_QUOTA"
class_name = "RoutePlanningQuota"

[[env.beta.durable_objects.bindings]]
name = "BUDDY_REGISTRATION_QUOTA"
class_name = "BuddyRegistrationQuota"

[[env.beta.durable_objects.bindings]]
name = "ACCOUNT_HANDOFF"
class_name = "AccountHandoff"

[[env.beta.durable_objects.bindings]]
name = "ACCOUNT_SYNC_INDEX"
class_name = "AccountSync"

[[env.beta.durable_objects.bindings]]
name = "SHARED_SPACE"
class_name = "SharedSpace"

[[env.beta.durable_objects.bindings]]
name = "SCRIBE_METER"
class_name = "ScribeMeter"

[[env.beta.durable_objects.bindings]]
name = "ACCOUNT_RATE_COUNTER"
class_name = "AccountRateCounter"

# Approving a browser from a phone (docs/passkeys-protocol.md): one channel
# per QR code, 75 seconds unclaimed, 5 minutes claimed.
[[env.beta.durable_objects.bindings]]
name = "ACCOUNT_APPROVAL"
class_name = "AccountApproval"

# Buddies note photos (encrypted blobs), separate from prod's bucket. Not
# inherited, like every binding. The Beta deploy creates it and sets its
# lifecycle rule (scripts/r2-lifecycle.mjs).
[[env.beta.r2_buckets]]
binding = "BUDDY_BLOBS"
bucket_name = "ww-buddy-blobs-beta"

# Account backups (witness-work ADR 0026), separate from prod's bucket.
# The Beta deploy creates it and sets its 400-day lifecycle rule
# (scripts/r2-lifecycle.mjs).
[[env.beta.r2_buckets]]
binding = "ACCOUNT_BACKUPS"
bucket_name = "ww-account-backups-beta"

# Cloud Sync snapshots (witness-work ADR 0030), separate from prod's bucket.
# The Beta deploy creates it and sets its 400-day lifecycle rule
# (scripts/r2-lifecycle.mjs).
[[env.beta.r2_buckets]]
binding = "ACCOUNT_SYNC"
bucket_name = "ww-account-sync-beta"

# Cloud Sync photos (witness-work ADR 0040), separate from prod's bucket.
# The Beta deploy creates it with no age rule (scripts/r2-lifecycle.mjs).
[[env.beta.r2_buckets]]
binding = "ACCOUNT_PHOTOS"
bucket_name = "ww-account-photos-beta"

# Anonymous accounts (witness-work ADR 0024): accounts, their status, and which
# Buddies inboxes they own. Not inherited, like every binding. Migrations come
# from `pnpm db:generate` (drizzle-kit); apply them before deploying code that
# needs them (the API deploy workflow does, before the Worker).
[[env.beta.d1_databases]]
binding = "ACCOUNTS_DB"
database_name = "ww-accounts-beta"
database_id = "99712dcc-ddcb-4bc8-bf64-52244aac7f6c"
migrations_dir = "migrations/accounts"

[[env.beta.migrations]]
tag = "v1"
new_sqlite_classes = ["NotesImportRun", "NotesImportIndex"]

[[env.beta.migrations]]
tag = "v2"
new_sqlite_classes = ["AppAttestIdentity"]

[[env.beta.migrations]]
tag = "v3"
new_sqlite_classes = ["BuddyInbox", "BuddyInvite"]

[[env.beta.migrations]]
tag = "v4"
new_sqlite_classes = ["PlayIntegrityChallenges"]

[[env.beta.migrations]]
tag = "v5"
new_sqlite_classes = ["RoutePlanningQuota"]

[[env.beta.migrations]]
tag = "v6"
new_sqlite_classes = ["BuddyRegistrationQuota"]

[[env.beta.migrations]]
tag = "v7"
new_sqlite_classes = ["AccountHandoff"]

[[env.beta.migrations]]
tag = "v8"
new_sqlite_classes = ["AccountSync"]

[[env.beta.migrations]]
tag = "v9"
new_sqlite_classes = ["ScribeMeter"]

# Beta is a new Worker, so its list is production's, tag for tag: add a new
# class at the end of every list (src/durableObjectMigrations.test.ts pins
# them).
[[env.beta.migrations]]
tag = "v10"
new_sqlite_classes = ["SharedSpace"]

[[env.beta.migrations]]
tag = "v11"
new_sqlite_classes = ["AccountRateCounter"]

[[env.beta.migrations]]
tag = "v12"
new_sqlite_classes = ["AccountApproval"]

[[env.beta.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "3001"   # distinct from prod's 1001 and dev's 2001

  [env.beta.ratelimits.simple]
  limit = 60
  period = 60

# Buddies per-caller limits (client IP, IPv6 by /64), one per op tier. Sizes
# and rationale: BUDDIES_ABUSE_LIMITS.edge in src/buddies/limits.ts, which
# limits.test.ts keeps equal to these (and to prod's and dev's below).
# Unsigned ops (invite/fetch, invite/claim).
[[env.beta.ratelimits]]
name = "BUDDIES_RATE_LIMITER"
namespace_id = "3002"   # distinct from prod's 1002 and dev's 2002

  [env.beta.ratelimits.simple]
  limit = 120
  period = 60

# inbox/register.
[[env.beta.ratelimits]]
name = "BUDDIES_REGISTER_LIMITER"
namespace_id = "3003"   # distinct from prod's 1003 and dev's 2003

  [env.beta.ratelimits.simple]
  limit = 60
  period = 60

# inbox/sync and the inbox/live upgrade.
[[env.beta.ratelimits]]
name = "BUDDIES_READ_LIMITER"
namespace_id = "3004"   # distinct from prod's 1004 and dev's 2004

  [env.beta.ratelimits.simple]
  limit = 600
  period = 60

# Every other signed op.
[[env.beta.ratelimits]]
name = "BUDDIES_WRITE_LIMITER"
namespace_id = "3005"   # distinct from prod's 1005 and dev's 2005

  [env.beta.ratelimits.simple]
  limit = 600
  period = 60

# blob/put (photo uploads).
[[env.beta.ratelimits]]
name = "BUDDIES_BLOB_PUT_LIMITER"
namespace_id = "3006"   # distinct from prod's 1006 and dev's 2006

  [env.beta.ratelimits.simple]
  limit = 60
  period = 60

# blob/get (photo downloads).
[[env.beta.ratelimits]]
name = "BUDDIES_BLOB_GET_LIMITER"
namespace_id = "3007"   # distinct from prod's 1007 and dev's 2007

  [env.beta.ratelimits.simple]
  limit = 600
  period = 60

# Shared Spaces' public guest ops (guest/sync, guest/put; witness-work ADR
# 0047), per network, keyed by an HMAC of the IP. Size:
# SPACES_LIMITS.guestRequestsPerMinute, which guest.test.ts keeps equal.
[[env.beta.ratelimits]]
name = "SPACES_GUEST_LIMITER"
namespace_id = "3008"   # distinct from prod's 1008 and dev's 2008

  [env.beta.ratelimits.simple]
  limit = 120
  period = 60

# Cloudflare Workers Observability — not inherited, so repeated for Beta.
# Full sampling: Beta traffic is small, and this is where problems show first.
[env.beta.observability]
enabled = true
head_sampling_rate = 1

  [env.beta.observability.logs]
  enabled = true
  invocation_logs = true

  [env.beta.observability.traces]
  enabled = true
  head_sampling_rate = 1

# --- Development (local only) ---------------------------------------------------
# Nothing is deployed from this block. It is the config `wrangler dev --env dev`
# runs locally (`pnpm dev`, and the verify loop in scripts/verify/dev.mjs):
# development App Attest, the dev bypass, the dev iOS bundle id, localhost
# origins, and every feature on. All bindings are simulated on disk, so the ids
# below name no Cloudflare resource.
[env.dev]
name = "ww-proxy-dev"
workers_dev = false
preview_urls = false

# Routes ARE inherited by named envs, so dev sets its own empty list; otherwise
# it would take prod's hosts, and `wrangler dev` would answer as one of them.
routes = []

[env.dev.version_metadata]
binding = "CF_VERSION_METADATA"

[env.dev.triggers]
crons = ["17 * * * *"]

[env.dev.vars]
# "Continue on the web" on the contact and Buddies invite pages.
WEB_APP_ORIGIN = "http://localhost:8081"
# Named environments do not inherit the production model override.
NOTES_IMPORT_MODEL = "openai/gpt-6-luna"
NOTES_IMPORT_REASONING_EFFORT = "low"
NOTES_IMPORT_PROVIDERS = "azure"
NOTES_IMPORT_MAX_OUTPUT_TOKENS = "32000"
# Explicitly permits development App Attest receipts and the simulator bypass.
APP_ATTEST_ENVIRONMENT = "development"
# Dev iOS bundle id (witness-work app.config.ts IS_DEV branch).
IOS_BUNDLE_ID = "com.leviwilkerson.jwtimedev"
# Deprecated and ignored: Supporter status follows witness-work ADR 0014.
REVENUECAT_ENTITLEMENT_ID = "Supporter"
# Count RevenueCat Billing (web) sandbox subscriptions as Supporter; dev only, never in [vars].
REVENUECAT_COUNT_WEB_SANDBOX = "true"
# Runtime-limit env fallbacks. Named environments do not inherit [vars], so all
# five are explicitly repeated here. KV `notes-import:limits` overrides each
# field independently for this environment.
NOTES_IMPORT_FREE_CREDITS = "3"
NOTES_IMPORT_FREE_CREDITS_SUPPORTER = "-1"
NOTES_IMPORT_MAX_REFINEMENTS = "5"
NOTES_IMPORT_MAX_REFINEMENTS_SUPPORTER = "-1"
NOTES_IMPORT_WINDOW_DAYS = "30"
# Buddies kill-switch fallback when KV `buddies:enabled` is absent. On in dev.
BUDDIES_ENABLED = "true"
# Buddies photo blobs fallback when KV `buddies:photos` is absent. On in dev.
BUDDIES_PHOTOS = "on"
# Legacy-auth fallback when KV `auth:legacy` is absent (witness-work ADR 0027):
# "off" refuses pre-session auth with 426 upgrade_required. Off on dev since the
# web launch (ADR 0038 §11); KV `auth:legacy` = "on" turns it back on here.
AUTH_LEGACY = "off"
# Passkeys (witness-work ADR 0038, docs/passkeys-protocol.md): the RP IDs this
# worker accepts (the first is the default, and the one Android origins pair
# with), and each RP ID's origins. Checked as pairs, never as two lists.
# Android: the Play app-signing key and the upload key of
# com.leviwilkerson.jwtime, and the debug key of com.leviwilkerson.jwtimedev.
# A native development build needs a real domain for its passkeys, and nothing
# is deployed for development, so it borrows Beta's RP ID
# (beta.app.witnesswork.app, whose association files list the dev app). Its
# passkeys are still stored only in this local worker.
PASSKEY_RP_IDS = "beta.app.witnesswork.app,localhost"
PASSKEY_ORIGINS = '''{"beta.app.witnesswork.app":["https://beta.app.witnesswork.app","android:apk-key-hash:TBOYNDcshVpuphnPrwPUa5EUFC3ry8vL8cHHQFU-HKw","android:apk-key-hash:xR7_3Ju_a8Are0wxkpALrEJnvW4F9M_FIXflNiOkdes","android:apk-key-hash:-sYXRdwJA3hvue3mKpYrOZ9zSPC7b4mbgzJmdZEDO5w"],"localhost":["http://localhost:8081","http://localhost:8082","http://localhost:19006","http://localhost:4173","http://localhost:5173"]}'''
# Web sign-up (docs/passkeys-protocol.md, "Web sign-up"): the kill switch's
# fallback when KV `accounts:web-signup` is absent, and the caps. Turnstile:
# Cloudflare's always-passing test site key until a dev widget exists; the
# matching test secret is used when the TURNSTILE_SECRET_KEY secret is unset.
# TURNSTILE_HOSTNAMES: where a token may be solved, the web app's Turnstile
# frame (witness-work docs/web-turnstile.md); checked under a real secret only.
WEB_SIGNUP = "on"
WEB_SIGNUP_PER_IP_DAY = "3"
WEB_SIGNUP_PER_ASN_HOUR = "30"
WEB_RECOVERY_PER_IP_DAY = "10"
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
TURNSTILE_HOSTNAMES = "verify-beta.witnesswork.app"
# App-wide minimum version fallback when KV `app:min-version` is absent
# (GET /app/v1/config). Unset = no floor.
# APP_MIN_VERSION = "1.42.0"
# Cloud Sync (witness-work ADR 0030) fallbacks when KV `sync:enabled` /
# `sync:entitlement` are absent. On in dev; free for everyone (ADR 0040).
SYNC_ENABLED = "true"
SYNC_ENTITLEMENT = "everyone"
# Record changes (witness-work ADR 0060) fallback when KV `sync:changes` is
# absent. On in dev. Only apps that send changes use it.
SYNC_CHANGES = "true"
# Shared Spaces (Shared Cars, witness-work ADR 0037) fallback when KV
# `spaces:enabled` is absent. On in dev.
SPACES_ENABLED = "true"
# Territories' guest links (witness-work ADR 0047): the public guest ops'
# fallback when KV `spaces:guests` is absent. On in dev.
SPACES_GUESTS = "true"
# The web app's origins (witness-work ADR 0038 §10): CORS and browser live
# sockets admit exactly these (comma-separated, no wildcards). Dev serves
# the local web dev servers (Expo/Metro 8081-8082, Expo web 19006, Vite
# preview 4173, Vite dev 5173). Named environments don't inherit
# [vars], so it's set in both.
WEB_APP_ORIGINS = "http://localhost:8081,http://localhost:8082,http://localhost:19006,http://localhost:4173,http://localhost:5173"
# Cloud Sync photos' switch fallback when KV `sync:photos` is absent (on).
# SYNC_PHOTO_LIMIT_BYTES (unset: 2,000,000,000) overrides the per-account photo
# storage; the verify launcher passes it for a tiny limit locally.
SYNC_PHOTOS = "on"
# Android Notes Import (witness-work ADR 0017). Stays off until the package,
